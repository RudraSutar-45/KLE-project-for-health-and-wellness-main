<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WellNest - Registration & Health Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f4faff] text-slate-800 antialiased min-h-screen flex justify-center p-0 md:p-6">
  <div class="w-full max-w-[420px] bg-[#f4faff] min-h-screen flex flex-col shadow-2xl md:rounded-[2.5rem] border border-slate-200/60 pb-8 relative">
    
    <!-- Top Header -->
    <header class="bg-white/90 backdrop-blur-md px-6 py-5 border-b border-slate-100 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-emerald-100 flex items-center justify-center text-emerald-800 font-bold text-xl">🌿</div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">WellNest</h1>
          <p class="text-[11px] text-slate-500 font-medium">Holistic Health & Vitality</p>
        </div>
      </div>
      <span class="text-xs px-2.5 py-1 bg-emerald-50 text-emerald-700 font-semibold rounded-full border border-emerald-100">Step 1 of 2</span>
    </header>

    <main class="flex-1 px-5 py-6 space-y-5 overflow-y-auto">
      <div>
        <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create Profile</h2>
        <p class="text-xs text-slate-500 mt-1">Personalized health intelligence calibrated to your biological stage.</p>
      </div>

      <form id="regForm" class="space-y-4" onsubmit="event.preventDefault(); handleRouting();">
        <!-- Full Name -->
        <div>
          <label class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Full Name</label>
          <div class="relative mt-1">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input required type="text" id="fullName" placeholder="Maya Chen" value="Maya Chen" class="w-full pl-10 pr-4 py-3 bg-white rounded-2xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
        </div>

        <!-- Age & Gender Grid -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Age</label>
            <div class="relative mt-1">
              <i data-lucide="calendar" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
              <input required type="number" id="userAge" min="1" max="120" value="17" oninput="updateBranchBanner(this.value)" class="w-full pl-10 pr-4 py-3 bg-white rounded-2xl border border-slate-200 text-sm font-semibold focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Gender</label>
            <select id="userGender" class="w-full mt-1 px-3.5 py-3 bg-white rounded-2xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="Female" selected>Female</option>
              <option value="Male">Male</option>
              <option value="Non-binary">Non-binary</option>
              <option value="Other">Prefer not to say</option>
            </select>
          </div>
        </div>

        <!-- Live Age Branching Preview Badge -->
        <div id="routingBadge" class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200/70 flex items-start gap-3">
          <i data-lucide="sparkles" class="w-4 h-4 text-emerald-600 shrink-0 mt-0.5"></i>
          <div class="text-xs">
            <span id="routeTitle" class="font-bold text-emerald-900 block">Youth Track Assigned (Age ≤ 20)</span>
            <span id="routeDesc" class="text-emerald-700 text-[11px] mt-0.5 block">Activates daily mood rhythm, study-rest distribution, and sleep-mood correlation science.</span>
          </div>
        </div>

        <!-- Mobile Number -->
        <div>
          <label class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Mobile Number</label>
          <div class="relative mt-1">
            <i data-lucide="phone" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input required type="tel" id="userMobile" placeholder="+1 (555) 349-2041" value="+1 (555) 349-2041" class="w-full pl-10 pr-4 py-3 bg-white rounded-2xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
        </div>

        <!-- Health Complications -->
        <div>
          <label class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Health Complications (Optional)</label>
          <div class="relative mt-1">
            <i data-lucide="shield-alert" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input type="text" id="userComplications" placeholder="e.g. Mild Asthma, Eye Fatigue, None" value="None / Pre-exam fatigue" class="w-full pl-10 pr-4 py-3 bg-white rounded-2xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div class="flex flex-wrap gap-1.5 mt-2">
            <span class="text-[10px] bg-slate-100 hover:bg-slate-200 cursor-pointer px-2 py-1 rounded-lg text-slate-600" onclick="setComplication('None')">None</span>
            <span class="text-[10px] bg-slate-100 hover:bg-slate-200 cursor-pointer px-2 py-1 rounded-lg text-slate-600" onclick="setComplication('Asthma')">Asthma</span>
            <span class="text-[10px] bg-slate-100 hover:bg-slate-200 cursor-pointer px-2 py-1 rounded-lg text-slate-600" onclick="setComplication('Migraine / Eye Strain')">Eye Strain</span>
            <span class="text-[10px] bg-slate-100 hover:bg-slate-200 cursor-pointer px-2 py-1 rounded-lg text-slate-600" onclick="setComplication('Mild Hypertension')">Hypertension</span>
          </div>
        </div>

        <button type="submit" class="w-full py-4 bg-emerald-700 hover:bg-emerald-800 text-white rounded-2xl font-bold text-sm shadow-lg shadow-emerald-700/20 transition-all flex items-center justify-center gap-2 mt-4">
          <span>Enter Personalized Dashboard</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </main>
  </div>

  <script>
    lucide.createIcons();
    function updateBranchBanner(val) {
      const age = parseInt(val, 10);
      const badge = document.getElementById('routingBadge');
      const title = document.getElementById('routeTitle');
      const desc = document.getElementById('routeDesc');
      if (age <= 20) {
        badge.className = "p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200/70 flex items-start gap-3";
        title.className = "font-bold text-emerald-900 block";
        title.textContent = "Youth Track Assigned (Age ≤ 20)";
        desc.className = "text-emerald-700 text-[11px] mt-0.5 block";
        desc.textContent = "Activates daily mood rhythm, study-rest distribution, and sleep-mood correlation science.";
      } else {
        badge.className = "p-3.5 rounded-2xl bg-sky-50 border border-sky-200/70 flex items-start gap-3";
        title.className = "font-bold text-sky-900 block";
        title.textContent = "Adult Vitals Track Assigned (Age > 18)";
        desc.className = "text-sky-700 text-[11px] mt-0.5 block";
        desc.textContent = "Activates clinical biomarkers (BP, SpO2), 10k step trajectory, hydration logs, and caloric burn.";
      }
    }
    function setComplication(text) {
      document.getElementById('userComplications').value = text;
    }
    function handleRouting() {
      const age = parseInt(document.getElementById('userAge').value, 10) || 18;
      if (age <= 20) {
        window.location.href = "2-youth-dashboard.html";
      } else {
        window.location.href = "3-adult-vitals.html";
      }
    }
  </script>
</body>
</html>
